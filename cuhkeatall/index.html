<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>食完中大所有餐廳</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        #map {
            height: 100vh;
        }
        .leaflet-marker-icon {
            filter: hue-rotate(160deg) drop-shadow(0 10px 5px #ffffff) drop-shadow(0 2px 3px rgba(0,0,0,.4));
        }
        .pin-label {
            /* background-color: none;
            box-shadow: 0 0 0;
            text-shadow: -2px -2px 0 #ffffff, 2px -2px 0 #ffffff, -2px 2px 0 #ffffff, 2px 2px 0 #ffffff; */
            border: 0;
            border-radius: 6px;
            background-color: #000000a0;
            padding: 2px 4px;
            box-shadow: 0 1px 4px #000000a0;
            color: #ffffff;
            font: 500 14px system-ui, sans-serif;
        }
        .pin-label .hidden {
            display: none;
        }

        .overlay {
            position: fixed;
            z-index: 1000;
            border-radius: 10px;
        }
        .black {
            background-color: #00000090;
            color: #f1f8f0;
        }
        .white {
            background-color: #f1f8f0;
            color: #000000;
        }
        #menu {
            left: 15px;
            top: 13px;
            width: 20px;
            height: 16px;
            padding: 13px 11px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s ease;
            z-index: 1004;
        }
        #menu span {
            display: block;
            height: 2.5px;
            background-color: #f1f8f0;
            border-radius: 2px;
            transition: 0.2s ease;
        }
        #menu.open span:nth-child(1) {
            transform: translateY(6.75px) rotate(45deg); background-color: #000000;
        }
        #menu.open span:nth-child(2) {
            opacity: 0;
        }
        #menu.open span:nth-child(3) {
            transform: translateY(-6.75px) rotate(-45deg); background-color: #000000;
        }
        #menu.open {
            left: 200px;
            background-color: #00000000;
        }
        #sidebar {
            position: fixed;
            top: 0px;
            left: -260px;
            width: 250px;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 0 0;
            transition: left 0.2s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 1003;
        }
        #sidebar .name {
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #00000020;
        }
        #sidebar .selects {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #00000060 transparent;
        }
        #sidebar .selects div {
            display: block;
            padding: 10px 20px;
            font-size: 18px;
            color: #0e4709;
            text-decoration: none;
            transition: 0.3s;
        }
        #sidebar .selects div svg {
            vertical-align: middle;
            margin-right: 6px;
        }
        #sidebar .selects div:hover {
            background-color: #619c5c;
            color: #f1f8f0;
        }
        #sidebar.open {
            box-shadow: 10px 0px 100px #00000050;
            left: 0px;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #00000066;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 1002;
        }
        #overlay.open {
            opacity: 0.5;
            visibility: visible;
        }
        
        #title {
            font-size: 20px;
            left: 50%;
            transform: translateX(-50%);
            top: 13px;
            padding: 6px 28px;
            padding-bottom: 7px;
            text-align: center;
            box-shadow: 3px 4px 6px #00000050;
            width: max-content;
            max-width: calc(100vw - 80px);
            transition: 0.3s ease;
        }
        #description {
            transform: translateY(-50%);
            display: block;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            font-size: 14px;
            transition: 0.4s ease, transform 0.3s ease;
        }
        #title:hover #description {
            transform: translateY(0%);
            max-height: 60px;
            opacity: 1;
        }

        #map-bottons {
            left: 15px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: 0.3s ease;
        }
        /* #map-bottons #zoomin, #map-bottons #zoomout{
            opacity: 0;
            display: none;
            transform: translateY(50%);
            transition: 0.3s ease;
        }
        #map-bottons:hover #zoomin, #map-bottons:hover #zoomout{
            opacity: 1;
            display: flex;
            transform: translateY(0%);
        } */
        #map-bottons > div {
            padding: 6px 6px;
            text-align: center;
        }
        #map-bottons > div + div {
            border-top: 1px solid #ffffff;
        }
        #map-bottons div svg {
            vertical-align: middle;
        }

        #rest-botton {
            right: 15px;
            bottom: 25px;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            transition: 0.3s ease;
        }

        #eye-botton {
            right: 15px;
            top: 13px;
            padding: 10px 10px;
            transition: 0.3s ease;
        }
        #eye-botton div > svg {
            vertical-align: middle;
        }
        #eye-botton div {
            display: none;
        }
        #eye-botton .toggled {
            display: block;
        }
        body:has(#eye-botton .close.toggled) .overlay:not(#eye-botton) {
            display: none;
        }

        #restaurant-info {
            display: auto;
            right: 15px;
            top: 15px;
            bottom: 15px;
            width: 30%;
            position: fixed;
            z-index: 1001;
            border-radius: 10px;
            background: #ffffff50;
            backdrop-filter: blur(20px) saturate(120%);
            /* -webkit-backdrop-filter: blur(5px) saturate(120%); */
            color: #000000;
            padding: 10px 10px;
        }
        #restaurant-info .close {
            position: fixed;
            right: 10px;
            top: 10px;
            width: 24px;
            height: 24px;
            font-size: 40px;
            /* border: 1px solid #00000020; */
            cursor: pointer;
        }
        #restaurant-info .close span {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #000000;
            border-radius: 2px;
        }
        #restaurant-info .close span:nth-child(1) {
            transform: translateY(-50%) rotate(45deg);
        }
        #restaurant-info .close span:nth-child(2) {
            transform: translateY(-50%) rotate(-45deg);
        }
        @media screen and (max-width: 800px) {
            #restaurant-info {
                top: auto;
                height: 35%;
                left: 15px;
                width: auto
            }
            body:has(#restaurant-info:not(.hidden)) :is(#map-bottons, #rest-botton) {
                bottom: calc(35% + 20px + 15px + 10px);
            }
        }
        @media screen and (min-width: 801px) {
            body:has(#restaurant-info:not(.hidden)) #title {
                left: calc(35% - 10px - 7.5px);
                transform: translateX(-50%);
            }
            body:has(#restaurant-info:not(.hidden)) :is(#rest-botton, #eye-botton) {
                right: calc(30% + 20px + 15px + 15px);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const map = L.map("map", {zoomControl: false, doubleClickZoom: false, zoomSnap: 0.25}).setView([22.4185, 114.2075], 16)
                    .on("click", () => {
                        Restaurant(null, null, null);
                    });

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        fetch("restaurants.json").then(res => res.json()).then(restaurants => {
            // console.log(restaurants);
            // console.log([...new Map([...restaurants].sort((a, b) => new Date(a.date) - new Date(b.date)).map(r => [r.no, r])).values()]);
            restaurants.forEach(p => {
                L.marker([p.lat, p.lng]).addTo(map)
                .on("click", () => {
                    Restaurant(p.no, p.lat, p.lng);
                }).bindTooltip(p.name, {permanent: true, direction: "center", offset: [-15, -25], className: "pin-label"});
            });
        }).catch(err => console.error("Problem:", err));
    </script>

    <div class="overlay black" id="menu"><span></span><span></span><span></span></div>

    <div id="sidebar">
        <div class="name">食完中大所有餐廳</div>
        <div class="selects">
            <div>不知道有什麽</div>
            <div>先測試看看</div>
            <div>弄多幾行比較好測試</div>
            <div><svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.967 12.75C12.967 11.75 13.967 11.3546 13.967 10.25C13.967 9.14543 13.0716 8.25 11.967 8.25C11.0351 8.25 10.252 8.88739 10.03 9.75M11.967 15.75H11.977M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>説明</div>
        </div>
    </div>
    <div id="overlay"></div>
    <script>
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menu = document.getElementById("menu");
        
        menu.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("open");
            menu.classList.toggle("open");
        });
        overlay.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("open");
            menu.classList.toggle("open");
        });
    </script>

    <div class="overlay black" id="title">食完中大所有餐廳<span id="description">Peter & Joyce</span></div>

    <div class="overlay black" id="map-bottons">
        <div id="zoomin" title="放大"><svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18M12 6V18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div id="zoomout" title="縮小"><svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12L18 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div id="locate" title="回到原點"><svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12H12.01M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12ZM16 8L9.5 9.5L8 16L14.5 14.5L16 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <script>
        const zoomin = document.getElementById("zoomin");
        const zoomout = document.getElementById("zoomout");
        const locate = document.getElementById("locate");
        
        zoomin.addEventListener("click", () => {
            map.zoomIn();
        });
        zoomout.addEventListener("click", () => {
            map.zoomOut();
        });
        locate.addEventListener("click", () => {
            map.setView([22.4185, 114.2075], 16);
        });
    </script>

    <div class="overlay black" id="rest-botton">
        <input type="checkbox"></input>
        <div class="name">餐廳名稱</div>
    </div>

    <div class="overlay black" id="eye-botton" title="顯示邊邊">
        <div class="close" id="eye-botton-open"><svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.99902 3L20.999 21M9.8433 9.91364C9.32066 10.4536 8.99902 11.1892 8.99902 12C8.99902 13.6569 10.3422 15 11.999 15C12.8215 15 13.5667 14.669 14.1086 14.133M6.49902 6.64715C4.59972 7.90034 3.15305 9.78394 2.45703 12C3.73128 16.0571 7.52159 19 11.9992 19C13.9881 19 15.8414 18.4194 17.3988 17.4184M10.999 5.04939C11.328 5.01673 11.6617 5 11.9992 5C16.4769 5 20.2672 7.94291 21.5414 12C21.2607 12.894 20.8577 13.7338 20.3522 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="open toggled" id="eye-botton-close"><svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.0007 12C15.0007 13.6569 13.6576 15 12.0007 15C10.3439 15 9.00073 13.6569 9.00073 12C9.00073 10.3431 10.3439 9 12.0007 9C13.6576 9 15.0007 10.3431 15.0007 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.0012 5C7.52354 5 3.73326 7.94288 2.45898 12C3.73324 16.0571 7.52354 19 12.0012 19C16.4788 19 20.2691 16.0571 21.5434 12C20.2691 7.94291 16.4788 5 12.0012 5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <script>
        const eyeBotton = document.getElementById("eye-botton");
        const eyeBottonOpen = document.getElementById("eye-botton-open");
        const eyeBottonClose = document.getElementById("eye-botton-close");
        
        eyeBotton.addEventListener("click", () => {
            eyeBottonOpen.classList.toggle("toggled");
            eyeBottonClose.classList.toggle("toggled");
        });
    </script>

    <div class="hidden" id="restaurant-info">
        <div class="close" id="restaurant-info-close"><span></span><span></span></div>
        test
    </div>
    <script>
        const restaurantInfo = document.getElementById("restaurant-info");
        let selected = null;
        function Restaurant(restid, lat, lng) {
            if (selected == null && restid == null) return;
            if (selected == null) {
                // map.panTo([lat, lng], {duration: 0.7});
                restaurantInfo.classList.toggle("hidden");
                selected = restid;
            } else if (restid == selected || restid == null) {
                restaurantInfo.classList.toggle("hidden");
                selected = null;
            } else {
                // map.panTo([lat, lng], {duration: 0.7});
                selected = restid;
            }
        }

        const restaurantInfoClose = document.getElementById("restaurant-info-close");
        restaurantInfoClose.addEventListener("click", () => {
            Restaurant(null, null, null);
        });
    </script>
</body>
