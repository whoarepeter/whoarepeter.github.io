<style>
    body {
        margin: 0;
        font-family: sans-serif;
        padding-top: 30px;
    }

    .navbar {
        position: fixed;
        top: 0;
        /* left: 0; */
        width: 100%;
        padding: 0px 0px;
        align-items: center;
        display: flex;

        background-color: #619c5c;
        color: #f1f8f0;

        /* justify-content: space-between; */
        /* align-items: center; */
        z-index: 1000;
    }
    .menu {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 16px;
        height: 14px;
        cursor: pointer;
        transition: 0.3s;
    }
    .menu:hover {
        background-color: #41703d;
    }
    .menu span {
        display: block;
        height: 2px;
        background-color: #f1f8f0;
        border-radius: 2px;
        transition: 0.3s;
    }
    .appName {

    }

        text-decoration: none;

    }
    .login {
        margin-left: auto;
        padding: 0px 15px;
    }
    .login button {
        font-size: 14px;
        /* font-weight: bold; */
        padding: 5px 11px;
        border-radius: 7px;
        background-color: #f1f8f0;
        color: #619c5c;
        border-color: #378331;
        border-style: solid;
        transition: 0.2s;
    }
    .login button:hover {
        background-color: #d4ddd3;
        color: #619c5c;
    }

    .sidebar {
        position: fixed;
        top: 46px;
        left: -260px;
        width: 250px;
        height: calc(100vh - 46px - 20px);
        background-color: #e2f5e0;
        box-shadow: 0 0 0;
        padding: 10px 0px;
        transition: left 0.2s ease;
        overflow-y: auto;
        z-index: 100;
        scrollbar-width: thin;
        scrollbar-color: #b1d1ae #e2f5e0;
    }
    .sidebar a {
        display: block;
        padding: 10px 20px;
        font-size: 18px;
        color: #0e4709;
        text-decoration: none;
        transition: 0.3s;
    }
    .sidebar a:hover {
        background-color: #619c5c;
        color: #f1f8f0;
    }
    .sidebar.open {
        box-shadow: 1px 0 100px #619c5cff;
        left: 0px;
    }
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #00000066;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        z-index: 99;
    }
    .overlay.open {
        opacity: 0.5;
        visibility: visible;
    }

    .popups {
        position: fixed;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 15px;
        z-index: 10000;
        pointer-events: none;
    }
    .popup {
        visibility: hidden;
        padding: 11px 21px;
        text-align: center;
        border-radius: 8px;
        font-size: 16px;
        background-color: #619c5cff;
        color: #f1f8f0;
        opacity: 0;
        transform: translateY(3px);
        transition: 0.3s ease-in-out;
    }
    .popup.show {
        visibility: visible;
        opacity: 1;
        transform: translateY(0px);
    }
</style>

<div class="navbar">

    <a href="about/">ℹ️ About</a>
</div>
<div class="overlay" id="overlay"></div>
<script>
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menu = document.getElementById("menu");
    
    menu.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("open");
    });
    overlay.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("open");
    });
</script>

<div class="popups" id="popups"></div>
<script>
    function popup(message = "default text lol", time = 2000) {
        const popups = document.getElementById("popups");
        const popup = document.createElement("div");
        popups.appendChild(popup);
        popup.className = "popup";
        popup.textContent = message;
        requestAnimationFrame(() => {
            popup.classList.add("show");
        });
        setTimeout(() => {
            popup.classList.remove("show");
            setTimeout(() => {
                popup.remove();
            }, 300);
        }, time);
    }
</script>
