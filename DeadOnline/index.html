<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadOnline</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            padding-top: 30px;
        }
        .navbar {
            position: fixed;
            top: 0;
            /* left: 0; */
            width: 100%;
            padding: 0px 0px;
            align-items: center;
            display: flex;
            background-color: #619c5c;
            font-family: sans-serif;
            color: #e2f1e1;
            /* position: relative; */
            z-index: 1000;
        }
        .menu {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 16px;
            height: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu:hover {
            background-color: #41703d;
        }
        .menu span {
            display: block;
            height: 2px;
            background-color: #e2f1e1;
            border-radius: 2px;
            transition: 0.3s;
        }
        .appName {
            padding: 0px 10px;
            /* font-weight: bold; */
            font-size: 20px;
        }
        .appName a {
            text-decoration: none;
            color: #e2f1e1;
        }
        .sidebar {
            position: fixed;
            top: 46px;
            left: -260px;
            width: 250px;
            height: calc(100vh - 46px - 20px);
            background-color: #e2f5e0;
            box-shadow: 0 0 0;
            padding: 10px 0px;
            transition: left 0.2s ease;
            overflow-y: auto;
            z-index: 100;
            scrollbar-width: thin;
            scrollbar-color: #b1d1ae #e2f5e0;
        }
        .sidebar a {
            display: block;
            padding: 10px 20px;
            font-size: 18px;
            color: #0e4709;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background-color: #619c5c;
            color: #e2f1e1;
        }
        .sidebar.open {
            box-shadow: 1px 0 100px #619c5cff;
            left: 0px;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #00000066;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 99;
        }
        .overlay.open {
            opacity: 0.5;
            visibility: visible;
        }
        /* body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; } */
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px; }
        #status { margin-top: 20px; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    
    <div class="navbar">
        <div class="menu" id="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="appName">
            <a href="/DeadOnline/">DeadOnline</a>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <a href="#">📅 Today's Schedule</a>
        <a href="#">🗓️ Month View</a>
        <a href="#">➕ Add Event</a>
        <a href="#">⚙️ Settings</a>
        <a href="/DeadOnline/about/">ℹ️ About</a>
    </div>
    <div class="overlay" id="overlay"></div>
    <script>
        menu.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        });
    </script>

    <h1>My Schedule App Test</h1>
    
    <!-- Login / Logout Buttons -->
    <button id="loginBtn">Sign in with Google</button>
    <button id="logoutBtn" style="display:none;">Sign Out</button>
    
    <!-- Add Test Event Button (hidden until logged in) -->
    <br>
    <button id="addEventBtn" style="display:none;">Save Test Event to Database</button>

    <p id="status">Not logged in</p>

    <!-- Firebase SDKs using modern ES Modules from CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Replace with your actual Firebase configuration keys from Step 4
        const firebaseConfig = {
          apiKey: "AIzaSyCAz9CCigxTwgpCP3RJlnvI8jQUyiNCwSE",
          authDomain: "testing-23851.firebaseapp.com",
          databaseURL: "https://testing-23851-default-rtdb.firebaseio.com",
          projectId: "testing-23851",
          storageBucket: "testing-23851.firebasestorage.app",
          messagingSenderId: "402258561370",
          appId: "1:402258561370:web:544084d7ac1c8217818b63",
          measurementId: "G-7DM6G0SMMP"
        };
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const addEventBtn = document.getElementById('addEventBtn');
        const statusText = document.getElementById('status');

        // 1. Handle Google Login
        const provider = new GoogleAuthProvider();
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                statusText.innerText = "Login failed: " + error.message;
            }
        });

        // 2. Handle Logout
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // 3. Listen for Login State Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                statusText.innerText = `Logged in as: ${user.displayName} (${user.email})`;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                addEventBtn.style.display = 'inline-block';
            } else {
                // User is signed out
                statusText.innerText = "Not logged in";
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
                addEventBtn.style.display = 'none';
            }
        });

        // 4. Save a Test Event to Firestore Database
        addEventBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) return;

            try {
                // Add a document to the 'events' collection
                await addDoc(collection(db, "events"), {
                    userId: user.uid,
                    title: "Test Event",
                    description: "Checking if database sync works!",
                    date: new Date().toISOString()
                });
                alert("Success! Event saved to Firebase Firestore.");
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error saving event: " + error.message);
            }
        });
    </script>
</body>
</html>
