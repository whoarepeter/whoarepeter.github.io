<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadOnline</title>
    <style>
        /* body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; } */
        /* button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px; } */
        #status { margin-top: 20px; color: #333; font-weight: bold; }
    </style>
</head>

<body>
    
    <!-- Framework -->
    <div id="framework"></div>
    <script>
        fetch("framework.html")
        .then(response => response.text())
        .then(data => {
            const container = document.getElementById("framework");
            container.innerHTML = data;
            const scripts = container.querySelectorAll("script");
            scripts.forEach(script => {
                const newScript = document.createElement("script");
                Array.from(script.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                if (script.src) newScript.src = script.src;
                else newScript.text = script.innerHTML;
                document.body.appendChild(newScript);
            });
        });
    </script>


    <h1>My Schedule App Test</h1>
    
    <!-- Login / Logout Buttons -->
    <button id="loginBtn">Sign in with Google</button>
    <button id="logoutBtn" style="display:none;">Sign Out</button>
    
    <!-- Add Test Event Button (hidden until logged in) -->
    <br>
    <button id="addEventBtn" style="display:none;">Save Test Event to Database</button>

    <p id="status">Not logged in</p>

    <!-- Firebase SDKs using modern ES Modules from CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Replace with your actual Firebase configuration keys from Step 4
        const firebaseConfig = {
            apiKey: "AIzaSyC7P6PfuIa6olm-apIshnzIHDyrWI27jL8",
            authDomain: "whoarepeter-web.firebaseapp.com",
            databaseURL: "https://whoarepeter-web-default-rtdb.firebaseio.com",
            projectId: "whoarepeter-web",
            storageBucket: "whoarepeter-web.firebasestorage.app",
            messagingSenderId: "833943519580",
            appId: "1:833943519580:web:908924e2a81aa10e554199"
        };
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const addEventBtn = document.getElementById('addEventBtn');
        const statusText = document.getElementById('status');

        // 1. Handle Google Login
        const provider = new GoogleAuthProvider();
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                statusText.innerText = "Login Failed (" + error.message + ")"
            }
        });

        // 2. Handle Logout
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // 3. Listen for Login State Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                statusText.innerText = `Logged in as: ${user.displayName} (${user.email})`;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                addEventBtn.style.display = 'inline-block';
            } else {
                // User is signed out
                statusText.innerText = "Not logged in";
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
                addEventBtn.style.display = 'none';
            }
        });

        // 4. Save a Test Event to Firestore Database
        addEventBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) return;

            try {
                // Add a document to the 'events' collection
                await addDoc(collection(db, "events"), {
                    userId: user.uid,
                    title: "Test Event",
                    description: "Checking if database sync works!",
                    date: new Date().toISOString()
                });
                alert("Success! Event saved to Firebase Firestore.");
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error saving event: " + error.message);
            }
        });
    </script>
</body>
</html>
